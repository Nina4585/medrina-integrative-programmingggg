<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Community Explorer</title>
    <style>
      :root {
        --primary-yellow: #f1c40f;
        --dark-amber: #f39c12;
        --light-cream: #fef9e7;
        --text-dark: #4a4a4a;
        --white: #ffffff;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: var(--light-cream);
        margin: 0;
        padding: 20px;
        color: var(--text-dark);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        text-align: center;
      }

      /* Header */
      .header-section {
        background: linear-gradient(
          135deg,
          var(--primary-yellow),
          var(--dark-amber)
        );
        color: #333;
        padding: 50px 20px;
        border-radius: 20px;
        margin-bottom: 40px;
        box-shadow: 0 6px 20px rgba(243, 156, 18, 0.2);
      }

      .header-section h1 {
        font-size: 3rem;
        margin: 0;
        font-weight: 700;
        text-shadow: 1px 1px 0 #fff;
      }

      .header-section p {
        font-size: 1.2rem;
        margin-top: 10px;
        color: #555;
      }

      /* Search area */
      .search-area {
        background: var(--white);
        padding: 15px 20px;
        border-radius: 50px;
        display: inline-flex;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        width: 100%;
        max-width: 500px;
        border: 3px solid var(--white);
      }

      .search-area input {
        flex: 1;
        padding: 12px 20px;
        border: 2px solid #eee;
        border-radius: 50px;
        outline: none;
        font-size: 1rem;
      }

      .search-area input:focus {
        border-color: var(--dark-amber);
      }

      .search-area button {
        padding: 12px 30px;
        background-color: var(--dark-amber);
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .search-area button:hover {
        background-color: #d35400;
        transform: scale(1.05);
      }

      /* Results grid */
      #apiResults {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        margin-top: 20px;
        justify-items: center;
      }

      .dog-card {
        background: var(--white);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #f9e79f;
        text-align: center;
        transition: all 0.3s ease;
        max-width: 280px;
      }

      .dog-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(243, 156, 18, 0.3);
      }

      .dog-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-bottom: 5px solid var(--primary-yellow);
      }

      .dog-info {
        padding: 15px 20px 25px;
      }

      .dog-info h3 {
        margin: 0;
        color: #b7950b;
        text-transform: capitalize;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .dog-info p {
        font-size: 0.95rem;
        margin: 10px 0 15px;
        color: #555;
        line-height: 1.3;
      }

      .dog-info button {
        padding: 8px 24px;
        font-weight: 600;
        font-size: 1rem;
        border-radius: 25px;
        background-color: var(--dark-amber);
        color: white;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .dog-info button:hover {
        background-color: #d35400;
        transform: scale(1.05);
      }

      .saved-btn-container {
        margin-top: 30px;
      }

      .saved-btn-container a button {
        background-color: var(--primary-yellow);
        border: none;
        border-radius: 40px;
        padding: 14px 40px;
        font-size: 1.1rem;
        font-weight: 700;
        color: #333;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        transition: all 0.3s ease;
      }

      .saved-btn-container a button:hover {
        background-color: var(--dark-amber);
        color: white;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-section">
        <h1>🐶 The Golden Community</h1>
        <p>Finding your favorite dog breeds, one search at a time.</p>
      </div>

      <div class="search-area">
        <input
          type="text"
          id="breedSearchInput"
          placeholder="Enter a breed (e.g. Beagle, Husky)"
        />
        <button id="searchBtn">Find Pups</button>
      </div>

      <div id="apiResults">
        <p style="grid-column: 1/-1; color: #777">
          Search for a breed to see results!
        </p>
      </div>

      <div class="saved-btn-container">
        <a href="saved.html"><button>View Saved Dogs</button></a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
