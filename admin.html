<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAWriends | Admin Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #ffd54f, #ffc107);
        color: #333;
      }
      header {
        background: #fff;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .logo {
        font-weight: bold;
        font-size: 1.5rem;
        color: #f57f17;
      }
      nav a {
        margin-left: 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
      }
      nav a.active {
        color: #f57f17;
      }
      .container {
        display: flex;
        min-height: calc(100vh - 70px);
        padding: 2rem;
        gap: 2rem;
      }
      aside {
        width: 220px;
        background: #fff;
        padding: 2rem 1rem;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        border-right: 1px solid #eee;
      }
      aside h3 {
        margin-bottom: 1.5rem;
        color: #f57f17;
      }
      aside a {
        display: block;
        margin-bottom: 1rem;
        text-decoration: none;
        color: #555;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        transition: 0.2s;
      }
      aside a:hover,
      aside a.active {
        background: #f57f17;
        color: #fff;
        font-weight: bold;
      }
      main {
        flex: 1;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
        color: #f57f17;
      }
      .card {
        background: #fff;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        margin-bottom: 2rem;
      }
      .card h3 {
        margin-bottom: 1rem;
        color: #f57f17;
      }
      .card p {
        line-height: 1.5rem;
        color: #555;
      }
      .dashboard-buttons a {
        display: inline-block;
        padding: 10px 20px;
        margin-right: 10px;
        margin-top: 10px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
        background: #fbc02d;
        color: #333;
        transition: 0.2s;
      }
      .dashboard-buttons a:hover {
        background: #f9a825;
      }
      footer {
        text-align: center;
        padding: 1rem;
        font-size: 0.9rem;
        color: #555;
        margin-top: 2rem;
      }
      @media (max-width: 900px) {
        .container {
          flex-direction: column;
        }
        aside {
          width: 100%;
          display: flex;
          justify-content: space-around;
          margin-bottom: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">PAWriends Admin</div>
      <nav>
        <a href="admin.html" class="active">Dashboard</a>
        <a href="manage-users.html">Manage Users</a>
        <a href="index.html">Logout</a>
      </nav>
    </header>

    <div class="container">
      <aside>
        <h3>Menu</h3>
        <a href="admin.html" class="active">Dashboard</a>
        <a href="manage-users.html">Manage Users</a>
        <a href="index.html">Logout</a>
      </aside>

      <main>
        <h1>Admin Dashboard</h1>
        <div class="card">
          <h3>Welcome, Admin!</h3>
          <p>All key functions are accessible from this dashboard.</p>
        </div>
      </main>
    </div>

    <footer>&copy; 2026 PAWriends | Admin Panel</footer>

    <script>
      const loggedInUser =
        JSON.parse(localStorage.getItem("pawCurrentUser")) || {};

      // Only allow admin@gmail.com
      if (
        !loggedInUser.email ||
        loggedInUser.email !== "admin@gmail.com" ||
        loggedInUser.role !== "admin"
      ) {
        alert("❌ Access denied. Admins only.");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
