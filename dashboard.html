<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAWriends Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(160deg, #ffd54f 0%, #ffc107 100%);
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      /* ------------------ Dashboard Welcome ------------------ */
      .dashboard-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 35px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(8px);
        text-align: center;
        max-width: 700px;
        width: 100%;
        margin-bottom: 30px;
        transition: all 0.3s ease;
      }

      .dashboard-container h1 {
        color: #ffb300;
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .dashboard-container p {
        font-size: 1rem;
        margin-bottom: 20px;
        color: #555;
      }

      .btn {
        display: inline-block;
        padding: 12px 25px;
        background: linear-gradient(135deg, #ffd54f, #ffc107);
        color: #333;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }

      /* ------------------ Search Area ------------------ */
      .search-area {
        background: #fff;
        padding: 15px 20px;
        border-radius: 50px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin-bottom: 40px;
        transition: all 0.3s ease;
      }

      .search-area input {
        flex: 1;
        padding: 12px 20px;
        border: 2px solid #eee;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
      }

      .search-area input:focus {
        border-color: #ffb300;
        box-shadow: 0 0 10px rgba(255, 180, 0, 0.4);
      }

      .search-area button {
        padding: 12px 25px;
        background: #ffb300;
        color: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .search-area button:hover {
        background: #e6a800;
        transform: scale(1.05);
      }

      /* ------------------ Results Grid ------------------ */
      #apiResults {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        width: 100%;
        max-width: 1200px;
        margin-bottom: 50px;
        justify-items: center;
      }

      .api-card {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: left;
        max-width: 300px;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .api-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      .api-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-bottom: 5px solid #ffc107;
        transition: transform 0.3s ease;
      }

      .api-card img:hover {
        transform: scale(1.05);
      }

      .api-card-info {
        padding: 18px 15px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .api-card-info h3 {
        margin: 0 0 10px;
        font-size: 1.25rem;
        color: #ff9800;
        font-weight: 700;
      }

      .api-card-info p {
        font-size: 0.95rem;
        color: #555;
        margin: 5px 0;
        line-height: 1.4;
      }

      .api-card-info button {
        margin-top: auto;
        padding: 10px 25px;
        background: #ffb300;
        color: #fff;
        font-weight: 600;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .api-card-info button:hover {
        background: #e6a800;
        transform: scale(1.05);
      }

      /* ------------------ Saved Dogs Button ------------------ */
      .saved-btn-container {
        text-align: center;
        margin-top: 30px;
      }

      .saved-btn-container button {
        background: linear-gradient(135deg, #ffd54f, #ffc107);
        border: none;
        border-radius: 30px;
        padding: 14px 50px;
        font-size: 1.1rem;
        font-weight: 700;
        color: #333;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease;
      }

      .saved-btn-container button:hover {
        background: #ffb300;
        color: #fff;
        transform: scale(1.05);
      }

      /* ------------------ Responsive ------------------ */
      @media (max-width: 768px) {
        .dashboard-container h1 {
          font-size: 2rem;
        }
        .search-area {
          flex-direction: column;
          gap: 15px;
        }
        .api-card img {
          height: 200px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Dashboard Welcome -->
    <div class="dashboard-container">
      <h1>Welcome to PAWriends! 🐾</h1>
      <p>You have successfully logged in. Start exploring dog breeds below!</p>
      <a href="index.html" class="btn">Back to Home</a>
    </div>

    <!-- Breed Search Area -->
    <div class="search-area">
      <input
        type="text"
        id="breedSearchInput"
        placeholder="Search dog breeds (e.g. Beagle, Husky)"
      />
      <button id="searchBtn">Find Pups</button>
    </div>

    <!-- API Results -->
    <div id="apiResults">
      <p style="grid-column: 1/-1; color: #777">
        Search for a breed to see adorable pups!
      </p>
    </div>

    <!-- View Saved Dogs -->
    <div class="saved-btn-container">
      <button onclick="location.href = 'saved.html'">View Saved Dogs</button>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
