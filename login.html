<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | PAWriends</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <span class="paw">PAW</span><span class="riends">riends</span>
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="signup.html">Sign Up</a>
        </div>
      </nav>
    </header>

    <section class="hero">
      <div
        class="hero-content"
        style="max-width: 400px; margin: auto; text-align: center"
      >
        <h1>Login</h1>

        <!-- ✅ Updated Form -->
        <form id="loginForm">
          <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
            style="
              width: 100%;
              padding: 0.8rem;
              margin: 0.5rem 0;
              border-radius: 10px;
              border: 1px solid #ccc;
            "
          />

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
            style="
              width: 100%;
              padding: 0.8rem;
              margin: 0.5rem 0;
              border-radius: 10px;
              border: 1px solid #ccc;
            "
          />

          <!-- ✅ Changed type to submit -->
          <button
            type="submit"
            class="btn primary"
            style="width: 100%; margin-top: 1rem"
          >
            Login
          </button>
        </form>

        <p style="margin-top: 1rem">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
        <p style="margin-top: 0.5rem">
          <a href="index.html">Back to Home</a>
        </p>
      </div>
    </section>

    <!-- ✅ Connect JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
