<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAWriends | Saved Dogs</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-yellow: #f1c40f;
        --dark-amber: #f39c12;
        --light-cream: #fef9e7;
        --soft-red: #e67e22; /* Warmer red-orange to match yellow theme */
        --text-dark: #2c3e50;
        --white: #ffffff;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--light-cream);
        color: var(--text-dark);
        margin: 0;
        padding: 40px 20px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        color: var(--dark-amber);
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      /* --- Grid --- */
      .dog-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
      }

      /* --- Card Styling --- */
      .dog-card {
        background: var(--white);
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .dog-card:hover {
        transform: translateY(-8px);
      }

      .dog-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      .dog-info {
        padding: 20px;
        text-align: center;
      }

      .dog-info h3 {
        margin: 0 0 15px 0;
        text-transform: capitalize;
        color: var(--text-dark);
      }

      /* --- The Fixed Deletion Button --- */
      /* We use a thick yellow border and amber text for a 'branded' delete look */
      .btn-delete {
        background: transparent;
        border: 2px solid var(--primary-yellow);
        color: var(--dark-amber);
        padding: 10px 24px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
      }

      .btn-delete:hover {
        background: var(--primary-yellow);
        color: #333;
        border-color: var(--primary-yellow);
      }

      /* --- Bottom Navigation --- */
      .footer-controls {
        margin-top: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .back-home-btn {
        text-decoration: none;
        background: var(--dark-amber);
        color: white;
        padding: 14px 40px;
        border-radius: 50px;
        font-weight: 700;
        transition: transform 0.2s ease;
      }

      .btn-clear-all {
        background: none;
        border: none;
        color: #95a5a6;
        text-decoration: underline;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .empty-state {
        text-align: center;
        grid-column: 1 / -1;
        padding: 60px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Saved Dogs</h1>
      </header>

      <div class="dog-list" id="savedDogsContainer"></div>

      <div class="footer-controls">
        <a href="index.html" class="back-home-btn">← Back to Gallery</a>
        <button id="clearAllBtn" class="btn-clear-all" style="display: none">
          Clear All Favorites
        </button>
      </div>
    </div>

    <script>
      const container = document.getElementById("savedDogsContainer");
      const clearBtn = document.getElementById("clearAllBtn");

      function loadSavedDogs() {
        let savedDogs = JSON.parse(localStorage.getItem("savedDogs")) || [];

        if (savedDogs.length === 0) {
          container.innerHTML = `<div class="empty-state"><h3>No pups saved yet! 🐾</h3></div>`;
          clearBtn.style.display = "none";
          return;
        }

        clearBtn.style.display = "block";
        container.innerHTML = "";

        savedDogs.forEach((dog, index) => {
          const card = document.createElement("div");
          card.classList.add("dog-card");
          card.innerHTML = `
            <img src="${dog.image}" alt="${dog.name}" />
            <div class="dog-info">
              <h3>${dog.name}</h3>
              <button class="btn-delete" onclick="removeDog(${index})">Remove</button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      function removeDog(index) {
        let savedDogs = JSON.parse(localStorage.getItem("savedDogs")) || [];
        savedDogs.splice(index, 1);
        localStorage.setItem("savedDogs", JSON.stringify(savedDogs));
        loadSavedDogs();
      }

      clearBtn.addEventListener("click", () => {
        if (confirm("Are you sure you want to clear all saved dogs?")) {
          localStorage.removeItem("savedDogs");
          loadSavedDogs();
        }
      });

      document.addEventListener("DOMContentLoaded", loadSavedDogs);
    </script>
  </body>
</html>
