<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAWriends | Your Pack</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #f1c40f;
        --accent: #f39c12;
        --dark: #1a1a1a;
        --cream: #fffdf5;
        --glass: rgba(255, 255, 255, 0.85);
        --radius: 40px;
        --transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
      }

      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--cream);
        color: var(--dark);
        line-height: 1.4;
        padding: 40px 20px;
      }

      .container {
        max-width: 1300px;
        margin: auto;
      }

      header {
        text-align: center;
        margin-bottom: 60px;
      }

      h1 {
        font-size: clamp(3rem, 8vw, 5rem);
        font-weight: 900;
        letter-spacing: -3px;
        line-height: 0.9;
        margin-bottom: 10px;
      }

      h1 span {
        color: var(--accent);
      }

      /* --- Grid --- */
      #savedDogsContainer {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        padding: 20px 0;
      }

      /* --- Card Styling (Matched to Index) --- */
      .dog-card {
        background: white;
        padding: 20px;
        border-radius: var(--radius);
        transition: var(--transition);
        text-align: left;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        border: 1px solid #eee;
        display: flex;
        flex-direction: column;
      }

      .dog-card:hover {
        transform: translateY(-15px) rotate(1deg);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
      }

      .dog-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 25px;
        margin-bottom: 20px;
      }

      .dog-info h3 {
        text-transform: capitalize;
        margin-bottom: 12px;
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--dark);
      }

      .dog-info p {
        margin-bottom: 6px;
        font-size: 0.95rem;
        color: #555;
      }

      .dog-info p strong {
        color: var(--dark);
        font-weight: 700;
      }

      .dog-info em {
        display: block;
        margin: 10px 0 20px 0;
        color: #777;
        font-size: 0.9rem;
      }

      /* --- Buttons --- */
      .btn-delete {
        background: #fff1f1;
        border: 2px solid #fee2e2;
        color: #ef4444;
        padding: 12px;
        border-radius: 50px;
        font-weight: 800;
        cursor: pointer;
        transition: var(--transition);
        width: 100%;
        margin-top: auto;
        font-family: inherit;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 1px;
      }

      .btn-delete:hover {
        background: #ef4444;
        color: white;
        border-color: #ef4444;
        transform: scale(1.05);
      }

      .footer-controls {
        margin-top: 80px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .back-home-btn {
        text-decoration: none;
        background: var(--dark);
        color: white;
        padding: 18px 50px;
        border-radius: 100px;
        font-weight: 800;
        font-size: 1.1rem;
        transition: var(--transition);
      }

      .back-home-btn:hover {
        background: var(--accent);
        transform: scale(1.1) rotate(-2deg);
      }

      .btn-clear-all {
        background: none;
        border: none;
        color: #94a3b8;
        text-decoration: underline;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.9rem;
        transition: 0.3s;
      }

      .btn-clear-all:hover {
        color: #ef4444;
      }

      .empty-state {
        text-align: center;
        grid-column: 1 / -1;
        padding: 100px 20px;
        background: white;
        border-radius: var(--radius);
        border: 2px dashed #ddd;
      }

      .empty-state h3 {
        font-size: 2rem;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Your <span>Pack.</span></h1>
        <p style="font-weight: 700; opacity: 0.6">
          All your favorite furry friends in one place.
        </p>
      </header>

      <div id="savedDogsContainer"></div>

      <div class="footer-controls">
        <a href="index.html" class="back-home-btn">ADD MORE DOGS</a>
        <button id="clearAllBtn" class="btn-clear-all" style="display: none">
          Dissolve Entire Pack
        </button>
      </div>
    </div>

    <script>
      const container = document.getElementById("savedDogsContainer");
      const clearBtn = document.getElementById("clearAllBtn");

      function loadSavedDogs() {
        let savedDogs = JSON.parse(localStorage.getItem("savedDogs")) || [];

        if (savedDogs.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>Your pack is currently empty! 🐾</h3>
              <p>Go back to the gallery and save some pups.</p>
            </div>`;
          clearBtn.style.display = "none";
          return;
        }

        clearBtn.style.display = "block";
        container.innerHTML = "";

        savedDogs.forEach((dog, index) => {
          const card = document.createElement("div");
          card.classList.add("dog-card");

          // Using data from the save function: name, image, age, owner, description, breed
          card.innerHTML = `
            <img src="${dog.image}" alt="${dog.name}" />
            <div class="dog-info">
              <h3>${dog.name}</h3>
              <p><strong>Breed:</strong> ${dog.breed || "Unknown"}</p>
              <p><strong>Age:</strong> ${dog.age || "N/A"} years</p>
              <p><strong>Owner:</strong> ${dog.owner || "Anonymous"}</p>
              <em>"${dog.description || "No description provided."}"</em>
              <button class="btn-delete" onclick="removeDog(${index})">Remove from Pack</button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      function removeDog(index) {
        let savedDogs = JSON.parse(localStorage.getItem("savedDogs")) || [];
        const dogName = savedDogs[index].name;

        savedDogs.splice(index, 1);
        localStorage.setItem("savedDogs", JSON.stringify(savedDogs));

        // Visual feedback
        loadSavedDogs();
      }

      clearBtn.addEventListener("click", () => {
        if (
          confirm(
            "Are you sure you want to clear your entire pack? This cannot be undone!",
          )
        ) {
          localStorage.removeItem("savedDogs");
          loadSavedDogs();
        }
      });

      document.addEventListener("DOMContentLoaded", loadSavedDogs);
    </script>
  </body>
</html>
